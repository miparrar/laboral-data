name: Inspect INE rama XLSX (one-off)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-rama.yml"
      - ".github/inspect_rama.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact INE workbook
        run: python3 .github/inspect_rama.py
      - name: Store inspection for parser setup
        run: |
          git add config/rama_inspection.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: inspect rama XLSX structure"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
