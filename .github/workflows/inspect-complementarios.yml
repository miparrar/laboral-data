name: Inspect ENE complementarios

on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect_complementarios.py"
      - ".github/workflows/inspect-complementarios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Inspect original Excel
        run: python scripts/inspect_complementarios.py
      - name: Commit inspection report
        run: |
          git add config/complementarios_inspeccion.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: inspect original complementary ENE workbook"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
