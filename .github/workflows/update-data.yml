name: Update ENE tabulados

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "Makefile"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "20 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: laboral-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      due: ${{ steps.calendar.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::tibble
            any::jsonlite
            any::yaml
            any::digest

      - name: Check ENE publication calendar
        id: calendar
        if: github.event_name == 'schedule'
        run: Rscript scripts/check_calendar.R

      - name: Inspect new hours workbook with R
        if: github.event_name != 'schedule'
        run: |
          mkdir -p data_raw
          Rscript -e 'utils::download.file("https://www.ine.gob.cl/docs/default-source/ocupacion-y-desocupacion/cuadros-estadisticos/series-vigentes/horas.xlsx?sfvrsn=d294ce0e_205", "data_raw/horas.xlsx", mode = "wb", quiet = TRUE)'
          Rscript scripts/inspect_tabulado.R data_raw/horas.xlsx config/horas_layout.json
          git add config/horas_layout.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: inspect ENE hours workbook structure"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Download, normalize and validate
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        run: |
          make update
          make test

      - name: Commit versioned JSON if changed
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        id: commit
        shell: bash
        run: |
          git add api/v1/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh official ENE indicators"
            # Las ejecuciones pueden comenzar sobre un main anterior.
            # Integramos primero commits nuevos sin reescribir el historial.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive original XLSX in GitHub Release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for NAME in indicadores_principales complementarios; do
            HASH=$(sha256sum "data_raw/$NAME.xlsx" | cut -d' ' -f1)
            TAG="source-$NAME-${HASH:0:16}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" "data_raw/$NAME.xlsx" \
                --title "INE $NAME (${HASH:0:16})" \
                --notes "Archivo original INE, SHA-256: $HASH" \
                --latest=false
            fi
          done

      - name: Prepare static site
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        run: |
          mkdir -p _site/api
          cp -R api/v1 _site/api/v1

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        with:
          path: _site

  deploy:
    needs: update
    if: github.event_name != 'schedule' || needs.update.outputs.due == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
