name: Update ENE tabulados

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "Makefile"
      - "site/**"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "20 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: laboral-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      due: ${{ steps.calendar.outputs.due }}
      artifact_ready: ${{ steps.pages_ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::tibble
            any::jsonlite
            any::yaml
            any::digest

      - name: Check ENE publication calendar
        id: calendar
        if: github.event_name == 'schedule'
        run: Rscript scripts/check_calendar.R

      - name: Download, normalize and validate
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        run: |
          make update
          make test
          Rscript -e 'm <- jsonlite::fromJSON("api/v1/manifest.json"); stopifnot(setequal(m$datasets$id, names(yaml::read_yaml("config/fuentes.yml")$sources))); message("Publicación validada: ", paste(m$datasets$id, collapse = ", "))'

      - name: Commit versioned JSON if changed
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        id: commit
        shell: bash
        run: |
          git add api/v1/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh official ENE tabulados"
            # Las ejecuciones pueden comenzar sobre un main anterior.
            # Integramos primero commits nuevos sin reescribir el historial.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive original XLSX in GitHub Release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for FILE in data_raw/*.xlsx; do
            NAME=$(basename "$FILE" .xlsx)
            HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
            TAG="source-$NAME-${HASH:0:16}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" "$FILE" \
                --title "INE $NAME (${HASH:0:16})" \
                --notes "Archivo original INE, SHA-256: $HASH" \
                --latest=false
            fi
          done

      - name: Prepare static site
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        run: |
          mkdir -p _site/api
          cp -R api/v1 _site/api/v1
          cp -R site/. _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'

      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        if: github.event_name != 'schedule' || steps.calendar.outputs.due == 'true'
        with:
          path: _site

      - name: Mark Pages artifact ready
        id: pages_ready
        if: steps.pages_artifact.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.artifact_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
