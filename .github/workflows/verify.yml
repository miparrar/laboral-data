name: Verify ENE publication

on:
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "Makefile"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::tibble
            any::jsonlite
            any::yaml
            any::digest

      - name: Regenerate API from INE sources
        run: make update

      - name: Test parser, client and deduplication
        run: make test

      - name: Audit published JSON
        run: make audit
