name: Inspect ENE age-series Excel (one-off)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-edad.yml"
      - "scripts/inspect_edad.py"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official workbook
        run: python3 scripts/inspect_edad.py
      - name: Commit verified layout report
        run: |
          git add config/edad_inspection.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: inspect ENE age-series Excel structure"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
